[project]
name = "recsys"
version = "0.1.0"
description = "Recommender systems study on Amazon Reviews 2023 (Musical Instruments)"
authors = [
    { name = "Галиев Камиль", email = "atheostheos@nomail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.1,<3",
    "implicit>=0.7.3,<0.8",
    "matplotlib>=3.11,<4",
    "numpy>=2.4,<3",
    "polars>=1.44,<2",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "replay-rec[spark]>=0.22,<0.23",
    "scikit-learn>=1.8,<2",
    "scipy>=1.18,<2",
    "typer>=0.27,<1",
]

[project.scripts]
recsys = "recsys.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4,<8",
    "nbconvert>=7.17,<8",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PL", "RUF", "NPY", "PERF"]
ignore = ["PLR0913"]  # model constructors legitimately take many hyperparameters

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are expected in assertions

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multi-module pipeline tests on synthetic data",
    "e2e: full CLI runs",
    "spark: needs a local SparkSession (slow startup)",
]
addopts = "-ra --strict-markers --cov=recsys --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["recsys"]
