# Default experiment config. Relative paths are resolved against the project root.
seed: 42
results_dir: results  # committed, machine-generated tables and figures

data:
  hf_repo: McAuley-Lab/Amazon-Reviews-2023
  category: Musical_Instruments
  download_dir: data            # raw JSONL lands in data/raw/{review,meta}_categories/
  interim_dir: data/interim     # typed parquet straight from raw
  processed_dir: data/processed # model-ready splits + item table

# Global temporal split. Reviews after test_end are dropped: monthly volume falls
# from ~20-30k to <5k after 2023-04 (data collection tail, not real demand).
split:
  val_start: 2022-10-01   # val  = [val_start, test_start)  -> tuning
  test_start: 2023-01-01  # test = [test_start, test_end)   -> final numbers
  test_end: 2023-04-01

evaluation:
  ks: [10, 20]               # metric cutoffs
  history_bins: [0, 1, 2, 5] # user segments by history length: 0 (cold), 1, 2-4, 5+

spark:                       # local SparkSession for RePlay models (machine: 17 GB RAM, 10 CPUs)
  driver_memory_gb: 8
  shuffle_partitions: 20
  local_dir: data/spark-tmp  # scratch space, gitignored

# Models compared in experiments (kind -> implementation in recsys.models.registry).
models:
  popular:            {kind: popularity}
  trending_90d:       {kind: popularity, window_days: 90}
  category_popular:   {kind: popularity, key: category}
  brand_popular:      {kind: popularity, key: brand}
  also_bought:        {kind: association_rules, min_item_count: 5, min_pair_count: 3}
  item_knn:           {kind: item_knn, num_neighbours: 10}
